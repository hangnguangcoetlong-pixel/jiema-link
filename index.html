<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在跳转...</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #333; margin: 0 0 10px; font-size: 18px; }
  p { color: #666; margin: 5px 0; font-size: 14px; }
  .url { color: #1a73e8; word-break: break-all; font-size: 12px; margin-top: 10px; }
  .error { color: #ea4335; }
  .btn { display: inline-block; margin-top: 15px; padding: 8px 20px; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">正在连接接码服务...</h2>
  <p id="msg">请稍候，正在获取最新服务地址</p>
  <p class="url" id="url"></p>
  <a href="#" class="btn" id="retry" style="display:none">手动重试</a>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var shareId = params.get('share_id') || '';
  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('msg');
  var urlEl = document.getElementById('url');
  var spinner = document.getElementById('spinner');
  var retryBtn = document.getElementById('retry');

  function showError(text) {
    spinner.style.display = 'none';
    titleEl.textContent = '连接失败';
    titleEl.className = 'error';
    msgEl.textContent = text;
    retryBtn.style.display = 'inline-block';
    retryBtn.onclick = function() { location.reload(); };
  }

  function doRedirect(baseUrl) {
    var target = baseUrl.replace(/\/+$/, '') + '/user';
    if (shareId) {
      target += '?share_id=' + encodeURIComponent(shareId);
    }
    urlEl.textContent = '跳转至: ' + target;
    msgEl.textContent = '正在跳转...';
    setTimeout(function() { window.location.href = target; }, 500);
  }

  fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(cfg) {
      var baseUrl = cfg.public_url || cfg.base_url || cfg.url || '';
      if (!baseUrl) {
        showError('服务地址未配置，请联系链接创建者');
        return;
      }
      titleEl.textContent = '连接成功';
      msgEl.textContent = '服务已上线，正在跳转...';
      doRedirect(baseUrl);
    })
    .catch(function(err) {
      showError('无法获取服务地址（' + err.message + '），请稍后重试或联系链接创建者');
    });
})();
</script>
</body>
</html>
