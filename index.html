<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在跳转...</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 420px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #333; margin: 0 0 10px; font-size: 18px; }
  p { color: #666; margin: 5px 0; font-size: 14px; line-height: 1.6; }
  .url { color: #1a73e8; word-break: break-all; font-size: 12px; margin-top: 10px; }
  .error { color: #ea4335; }
  .success { color: #34a853; }
  .btn { display: inline-block; margin-top: 15px; padding: 10px 24px; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; }
  .btn:hover { background: #1557b0; }
  .progress { color: #999; font-size: 12px; margin-top: 8px; }
  .tip { background: #f8f9fa; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: left; font-size: 12px; color: #666; }
  .tip b { color: #333; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">正在连接接码服务...</h2>
  <p id="msg">请稍候，正在获取最新服务地址</p>
  <p class="progress" id="progress"></p>
  <p class="url" id="url"></p>
  <button class="btn" id="retry" style="display:none">手动重试</button>
  <div class="tip" id="tip" style="display:none">
    <b>如果一直连接失败：</b><br>
    1. 请确认链接创建者已启动程序<br>
    2. 请检查您的网络连接<br>
    3. 可尝试切换网络（如手机热点）后重试<br>
    4. 如仍无法访问，请联系链接创建者
  </div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var shareId = params.get('share_id') || '';
  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('msg');
  var urlEl = document.getElementById('url');
  var progressEl = document.getElementById('progress');
  var spinner = document.getElementById('spinner');
  var retryBtn = document.getElementById('retry');
  var tipEl = document.getElementById('tip');

  var MAX_RETRIES = 6;
  var RETRY_INTERVAL = 2500;
  var retryCount = 0;

  function showError(text) {
    spinner.style.display = 'none';
    titleEl.textContent = '连接失败';
    titleEl.className = 'error';
    msgEl.textContent = text;
    progressEl.textContent = '';
    retryBtn.style.display = 'inline-block';
    tipEl.style.display = 'block';
    retryBtn.onclick = function() { location.reload(); };
  }

  function showRetry() {
    retryCount++;
    progressEl.textContent = '正在重试（第 ' + retryCount + '/' + MAX_RETRIES + ' 次）...';
  }

  function doRedirect(baseUrl) {
    var target = baseUrl.replace(/\/+$/, '') + '/user';
    if (shareId) {
      target += '?share_id=' + encodeURIComponent(shareId);
    }
    urlEl.textContent = '跳转至: ' + target;
    msgEl.textContent = '连接成功，正在跳转...';
    titleEl.textContent = '连接成功';
    titleEl.className = 'success';
    progressEl.textContent = '';
    setTimeout(function() { window.location.href = target; }, 800);
  }

  function fetchConfig() {
    fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(cfg) {
        var baseUrl = cfg.public_url || cfg.base_url || cfg.url || '';
        if (!baseUrl) {
          if (retryCount < MAX_RETRIES) {
            showRetry();
            setTimeout(fetchConfig, RETRY_INTERVAL);
          } else {
            showError('服务地址未配置，请确认链接创建者已启动程序');
          }
          return;
        }
        doRedirect(baseUrl);
      })
      .catch(function(err) {
        if (retryCount < MAX_RETRIES) {
          showRetry();
          setTimeout(fetchConfig, RETRY_INTERVAL);
        } else {
          showError('无法获取服务地址（' + err.message + '），请确认链接创建者已启动程序，或检查您的网络连接');
        }
      });
  }

  // 开始获取
  fetchConfig();
})();
</script>
</body>
</html>
